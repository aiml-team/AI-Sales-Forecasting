<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Sales Forecast Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/dashboard_style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
  <!-- 🔷 Topbar -->
  <nav class="navbar navbar-expand-lg topbar-blue px-3">
    <div class="container-fluid align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <!-- Hamburger Button -->
        <button class="btn btn-light me-3" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
          ☰
        </button>
        <!-- Company Logo -->
        <img src="/static/images/logo.png" alt="Company Logo" class="topbar-logo" />
      </div>
      <!-- Title -->
      <h4 class="mb-0 text-white fw-bold text-center flex-grow-1">AI Sales Forecasting Dashboard</h4>
    </div>
  </nav>

  <!-- 🍔 Sidebar -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="list-group">
        <li class="list-group-item">Version 1.0.0</li>
        <li class="list-group-item"><a href="#">Release Notes</a></li>
        <li class="list-group-item"><a href="#">User Manual</a></li>
        <li class="list-group-item"><a href="#">Feedback Form</a></li>
      </ul>
    </div>
  </div>

  <!-- 🚀 Main Container -->
  <div class="container mt-4">
    <!-- 🎛️ Filters -->
    <div class="row g-3 mb-4 align-items-end">
      <div class="col-md-4">
        <label class="form-label">Employee</label>
        <select id="filterEmployee" class="form-select"></select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Region</label>
        <select id="filterRegion" class="form-select"></select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Quarter</label>
        <select id="filterQuarter" class="form-select"></select>
      </div>
    </div>

    <!-- 🔄 Reset & Theme -->
    <div class="d-flex justify-content-end gap-2 mb-3">
      <button id="resetBtn" class="btn btn-outline-secondary">Reset Filters</button>
      <button id="darkToggle" class="btn btn-outline-dark">🌗 Dark/Light</button>
    </div>

    <!-- 📊 Charts Row 1 -->
    <div class="row mb-4">
      <div class="col-md-6 mb-4">
        <div class="card p-3">
          <h6 class="text-center" id="quarterlyTitle">Quarterly Forecast</h6>
          <canvas id="quarterlyBarChart"></canvas>
        </div>
      </div>
      <div class="col-md-6 mb-4">
        <div class="card p-3">
          <h6 class="text-center">Forecast per Region</h6>
          <canvas id="regionBarChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 🥧 Monthly Donut Chart + KPI Cards -->
    <div class="row mb-4">
      <div class="col-md-6 mb-4">
        <div class="card p-3 canvasPie">
          <h6 class="text-center" id="pieTitle">Monthly Breakdown</h6>
          <canvas id="monthlyPieChart"></canvas>
        </div>
      </div>
      <div class="col-md-6 mb-4 totalperform">
        <div class="row g-3">
          <div class="col-12">
            <div class="card card-accent-orange p-3 text-center">
              <h6>Total Sales</h6>
              <p id="topForecast">$0 M</p>
            </div>
          </div>
          <div class="col-12">
            <div class="card card-accent-green p-3 text-center">
              <h6>Top Performer</h6>
              <p id="topPerformer">N/A</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 📈 Annual Line Chart -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="card p-3 annual-bar">
          <h6 class="text-center">Annual Forecast</h6>
          <canvas id="annualBarChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- 📎 Footer -->
  <footer class="text-center py-3 text-muted small">
    &copy; 2025 AI Sales Forecasting Dashboard. All rights reserved.
  </footer>

  <!-- 📜 Scripts -->
  <script src="/static/js/dashboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
