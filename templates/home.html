<body>
  <!-- 🔷 Topbar -->
  <nav class="navbar navbar-expand-lg topbar-blue px-3 ">
    <div class="container-fluid align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <!-- Company Logo -->
        <img src="/static/images/logo.png" alt="Company Logo" class="topbar-logo" />
      </div>
      <!-- Title -->
      <h4 class="mb-0 text-white fw-bold text-center flex-grow-1">AI Sales Forecasting Dashboard</h4>
    </div>
  </nav>

 
  <!-- Main Content -->
  <div class="main-content">
    <div class="main-canvas">
      <h3>File Upload</h3>
      <div class="upload-box">
        <label for="fileUpload" class="upload-label">Choose Data File</label>
        <input type="file" id="fileUpload" accept=".xlsx" />
        <p>Drag & drop or click to upload sales data.<br>
        Please make sure to upload a file with "ProdL-SOP.xlsx" name</p>
      </div>

      <div id="statusMessage" class="status-message" style="display: none;">File loaded successfully.</div>
      <button id="submitBtn" class="submit-button" disabled>Preview File</button>
      <div id="preview" class="preview" style="display: none;"></div>

      <button class="status-btn" id="runForecast">Forecast</button>
      <div id="forecastNote" style="display: none; font-style: italic; text-align: center; margin-top: 10px;">
        The dashboard usually takes 2-4 minutes as the data is being analysed.
      </div>

      <div class="section-download-section">
        <!--<button class="status-btn" onclick="checkDownloadStatus()">Check File Status</button>-->
        <button class="download-btn" onclick="downloadFile()">Download Output</button>
        <div id="statusInfo" class="status-info"></div>
      </div>
    
  <!-- Scripts -->
  <script>
    // Highlight nav based on current URL path
    const path = window.location.pathname;
     

    function openDashboard() {
      window.open('/dashboard', '_blank');
    }

    async function checkDownloadStatus() {
      const statusDiv = document.getElementById('statusInfo');
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = 'Checking status...';
      statusDiv.className = 'status-info';

      try {
        const response = await fetch('/download-status');
        const data = await response.json();

        if (data.available) {
          statusDiv.innerHTML = `File is available for download<br>`;
        } else {
          statusDiv.innerHTML = 'File not found in destination container';
        }
      } catch (error) {
        statusDiv.innerHTML = 'Error checking file status: ' + error.message;
      }
    }

    async function downloadFile() {
      const downloadBtn = event.target;
      const originalText = downloadBtn.textContent;
      downloadBtn.textContent = 'Downloading...';
      downloadBtn.disabled = true;

      try {
        const response = await fetch('/download');
        if (response.ok) {
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'forecast_output.xlsx';
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);

          Swal.fire({ icon: 'success', title: 'Download Complete', text: 'The file has been downloaded successfully!' });

        } else {
          const errorData = await response.json();
          Swal.fire({ icon: 'error', title: 'Download Failed', text: errorData.error || 'Unknown error' });
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Download Failed', text: err.message });
      } finally {
        downloadBtn.textContent = originalText;
        downloadBtn.disabled = false;
      }
    }

    const fileInput = document.getElementById('fileUpload');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const previewDiv = document.getElementById('preview');
    let workbookData = null;

    fileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          workbookData = workbook;
          statusMessage.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.classList.add('enabled');
        };
        reader.readAsArrayBuffer(file);
      }
    });

    submitBtn.addEventListener('click', function () {
      if (workbookData) {
        const sheet = workbookData.Sheets[workbookData.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        if (jsonData.length === 0) {
          previewDiv.innerHTML = "<p>No data to preview.</p>";
        } else {
          const headerRow = jsonData[0];
          const dataRows = jsonData.slice(1, 11);

          let html = "<table><thead><tr>";
          headerRow.forEach(cell => html += `<th>${cell}</th>`);
          html += "</tr></thead><tbody>";
          dataRows.forEach(row => {
            html += "<tr>";
            headerRow.forEach((_, i) => {
              html += `<td>${row[i] !== undefined ? row[i] : ""}</td>`;
            });
            html += "</tr>";
          });
          html += "</tbody></table>";

          previewDiv.innerHTML = html;
          previewDiv.style.display = 'block';
        }
      }
    });

    document.getElementById("runForecast").addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        Swal.fire({ icon: "warning", title: "Please select a file to upload." });
        return;
      }

      document.getElementById("forecastNote").style.display = "block";

      const formData = new FormData();
      formData.append("file", file);

      const button = document.getElementById("runForecast");
      button.disabled = true;
      button.textContent = "Uploading...";

      try {
        const res = await fetch("/forecast", { method: "POST", body: formData });
        const json = await res.json();

        if (res.ok) {
          Swal.fire({ icon: "success", title: "Upload Successful", text: json.message });
          statusMessage.textContent = json.message;
        } else {
          Swal.fire({ icon: "error", title: "Upload Failed", text: json.error || "Something went wrong" });
        }
      } catch (err) {
        Swal.fire({ icon: "error", title: "Network Error", text: err.message });
      } finally {
        button.disabled = false;
        button.textContent = "Forecast";
      }
    });
  </script>
</body>
